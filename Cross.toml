# cross's build images, pinned by digest (the multi-arch index for cross 0.2.5's tag) so a
# re-pushed tag can't change what builds the release. Update with cross in release.yml.
# mimalloc's C code writes __DATE__ and __TIME__ into the binary; the release workflow sets
# SOURCE_DATE_EPOCH to the tagged commit's time, which GCC uses for them, so a commit builds the
# same bytes every time. cross passes it into its container only when told to.
[build.env]
passthrough = ["SOURCE_DATE_EPOCH"]

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:0.2.5@sha256:77db671d8356a64ae72a3e1415e63f547f26d374fbe3c4762c1cd36c7eac7b99"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:0.2.5@sha256:702154f52b2d8091671aa2c84d5582d849f949977228c735ff8462f93cc0e1e4"
