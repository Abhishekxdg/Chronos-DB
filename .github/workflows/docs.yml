# The docs site (site/, Docusaurus over docs/) on GitHub Pages: https://abhishekxdg.github.io/Chronos-DB/
# Rebuilt when the docs or the site change on main. Broken links fail the build (onBrokenLinks: throw).
name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions: { contents: read }

concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci && npm run build
        working-directory: site
        env: { DOCS_URL: https://abhishekxdg.github.io, DOCS_BASE_URL: /Chronos-DB/ }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site/build }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
